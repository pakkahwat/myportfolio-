# Cloudflare Workers config for the Next.js site.
# `next build` with `output: 'export'` (see next.config.mjs) produces out/ —
# a fully static bundle, so this Worker has no `main` entry: Workers Static
# Assets serves the files directly.
#
# Deploy:  npm run build && npx wrangler deploy
# Or connect the repo in the Cloudflare dashboard (Workers > Builds) and it
# will run the build command + wrangler deploy automatically using this file.

name = "myportfolio"
compatibility_date = "2025-06-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
